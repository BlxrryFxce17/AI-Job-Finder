<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Job Copilot & Autofill</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      width: 360px;
      min-height: 460px;
      background: #0f172a;
      color: #f1f5f9;
      font-size: 13px;
      overflow-x: hidden;
    }

    .header {
      padding: 14px 16px;
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.9) 0%, rgba(15, 23, 42, 0.9) 100%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-icon {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.35);
    }

    .brand-name {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #f8fafc;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 600;
    }

    .status-badge.online {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }

    .status-badge.offline {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    .status-badge.online .status-dot {
      background: #4ade80;
      box-shadow: 0 0 6px #4ade80;
    }

    .status-badge.offline .status-dot {
      background: #f87171;
    }

    .content {
      padding: 16px;
    }

    .card {
      background: rgba(30, 41, 59, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 14px;
    }

    .profile-title {
      font-size: 14px;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 2px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .profile-subtitle {
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 8px;
    }

    .meta-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 11px;
      color: #cbd5e1;
      margin-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 8px;
    }

    .meta-row {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .meta-icon {
      font-size: 12px;
      color: #38bdf8;
      width: 14px;
      text-align: center;
      flex-shrink: 0;
    }

    .skills-pills {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .skill-chip {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(56, 189, 248, 0.1);
      color: #7dd3fc;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 10px 14px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.15s ease;
      text-decoration: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.35);
    }

    .btn-primary:hover {
      filter: brightness(1.1);
      box-shadow: 0 4px 20px rgba(2, 132, 199, 0.5);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-top: 8px;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }

    .notice {
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 11px;
      margin-bottom: 12px;
      display: none;
      align-items: center;
      gap: 6px;
      line-height: 1.4;
    }

    .notice.info {
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      color: #7dd3fc;
      display: flex;
    }

    .notice.success {
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #86efac;
      display: flex;
    }

    .notice.error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      display: flex;
    }

    .footer {
      padding: 10px 16px;
      background: rgba(15, 23, 42, 0.7);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 10px;
      color: #64748b;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .footer a {
      color: #38bdf8;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    .token-box {
      margin-top: 10px;
      display: none;
    }

    .token-box input {
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 11px;
      color: #fff;
      font-family: monospace;
      outline: none;
      margin-bottom: 6px;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: #94a3b8;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="brand-icon">⚡</div>
      <div class="brand-name">AI Job Copilot</div>
    </div>
    <div id="statusBadge" class="status-badge offline">
      <span class="status-dot"></span>
      <span id="statusText">Checking...</span>
    </div>
  </div>

  <div class="content">
    <div id="noticeBanner" class="notice"></div>

    <!-- Connected Profile View -->
    <div id="profileSection" class="card" style="display: none;">
      <div class="profile-title">
        <span id="profileName">Candidate</span>
        <span style="font-size: 10px; font-weight: 600; color: #38bdf8; background: rgba(56, 189, 248, 0.1); padding: 2px 6px; borderRadius: 4px;">SYNCED</span>
      </div>
      <div id="profileRole" class="profile-subtitle">Software Engineer</div>

      <div class="meta-list">
        <div class="meta-row"><span class="meta-icon">✉️</span><span id="profileEmail">user@email.com</span></div>
        <div class="meta-row"><span class="meta-icon">📞</span><span id="profilePhone">Not set</span></div>
        <div class="meta-row"><span class="meta-icon">🔗</span><span id="profileLinks">GitHub • LinkedIn • Portfolio</span></div>
      </div>

      <div id="skillsContainer" class="skills-pills"></div>
    </div>

    <!-- Unauthenticated View -->
    <div id="authSection" class="card" style="display: none;">
      <div class="profile-title">Connect Your Account</div>
      <p style="font-size: 11px; color: #94a3b8; margin: 4px 0 10px; line-height: 1.4;">
        Connect to your AI Job Finder cloud account to autofill jobs with 1 click.
      </p>
      <button id="btnAutoSync" class="btn btn-primary">
        <span>🔄</span>
        <span>Auto-Sync Token from Web App</span>
      </button>

      <button id="btnToggleManualToken" class="btn btn-secondary" style="font-size: 11px; padding: 6px;">
        Paste Token Manually
      </button>

      <div id="manualTokenBox" class="token-box">
        <input id="tokenInput" type="password" placeholder="Paste Bearer JWT token here...">
        <button id="btnSaveManualToken" class="btn btn-primary" style="padding: 6px; font-size: 11px;">Save Token</button>
      </div>
    </div>

    <!-- Actions Section -->
    <div id="actionsSection" style="display: none;">
      <button id="btnOpenSidebarCurrentTab" class="btn btn-primary" style="margin-bottom: 8px; background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);">
        <span>⚡</span>
        <span>Open Copilot Sidebar (Right-Side)</span>
      </button>

      <button id="btnAutofillCurrentTab" class="btn btn-secondary">
        <span>🚀</span>
        <span>Quick Autofill Active Page</span>
      </button>

      <button id="btnLogJobCurrentTab" class="btn btn-secondary">
        <span>💾</span>
        <span>Log Job to Applied Tracker</span>
      </button>

      <div class="toggle-row">
        <span>Show Floating In-Page Widget</span>
        <input type="checkbox" id="toggleFloatingWidget" checked style="cursor: pointer;">
      </div>
    </div>
  </div>

  <div class="footer">
    <span>Engine: Groq + Gemini 2.5</span>
    <a href="https://ai-job-finder-alpha.vercel.app" target="_blank">Open Web App ↗</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
